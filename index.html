<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Online 30-Power Chess</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #1a1917;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 4px;
        }
        .top-bar {
            width: 100%;
            max-width: 480px;
            background-color: #262522;
            padding: 6px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            font-weight: bold;
            border-bottom: 1px solid #383633;
            border-radius: 6px;
        }
        .online-panel {
            width: 100%;
            max-width: 480px;
            background-color: #22211e;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid #383633;
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: 3px;
        }
        .online-row {
            display: flex;
            gap: 4px;
            align-items: center;
            justify-content: space-between;
        }
        .online-input {
            background: #312e2b;
            border: 1px solid #45423e;
            color: #fff;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 11px;
            flex: 1;
            min-width: 0;
        }
        .online-btn {
            background: #81b64c;
            color: #000;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }
        .online-btn.secondary {
            background: #383633;
            color: #fff;
            border: 1px solid #555;
        }
        .online-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .player-section {
            width: 100%;
            max-width: 480px;
            padding: 2px 4px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .player-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .player-info {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .avatar {
            width: 24px;
            height: 24px;
            background-color: #383633;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .player-name {
            font-size: 12px;
            font-weight: 600;
            color: #c3c2c1;
        }
        .active-turn { color: #81b64c; font-size: 11px; font-weight: bold; }
        .check-text { color: #ef4444 !important; animation: blink 0.8s infinite alternate; }
        
        /* Single Unlock Button Style */
        .unlock-power-btn {
            background-color: #312e2b;
            border: 1px solid #f59e0b;
            color: #fbbf24;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.15s;
        }
        .unlock-power-btn:hover {
            background-color: #3d3a35;
        }

        .power-drawer {
            background: #22211e;
            padding: 3px;
            border-radius: 4px;
            border: 1px solid #383633;
            display: none; /* အစပိုင်းမှာ ဖျောက်ထားပါမယ် */
        }
        .power-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
        }
        .power-btn {
            background-color: #312e2b;
            border: 1px solid #45423e;
            color: #e0dfde;
            padding: 4px 1px;
            border-radius: 3px;
            font-size: 8.5px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.15s;
        }
        .power-btn:disabled { opacity: 0.22; cursor: not-allowed; }
        .power-btn.active-mode {
            background-color: #f59e0b;
            color: #000;
            border-color: #fbbf24;
            box-shadow: 0 0 6px rgba(245, 158, 11, 0.7);
        }
        
        #power-banner {
            width: 100%;
            max-width: 480px;
            background-color: #3d3a35;
            color: #fbbf24;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 6px;
            display: none;
            border-radius: 4px;
        }
        .banner-danger {
            background-color: #dc2626 !important;
            color: #ffffff !important;
            animation: blink 0.8s infinite alternate;
        }
        @keyframes blink { from { opacity: 1; } to { opacity: 0.75; } }

        #board-wrapper {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #board {
            width: 94vw;
            height: 94vw;
            max-width: 370px;
            max-height: 370px;
            display: grid;
            grid-template-columns: repeat(8, 12.5%);
            grid-template-rows: repeat(8, 12.5%);
            user-select: none;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
        }
        .square {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }
        .light { background-color: #ebecd0; color: #739552; }
        .dark { background-color: #739552; color: #ebecd0; }
        .selected { background-color: #f5f682 !important; }
        .last-move { background-color: rgba(245, 246, 130, 0.45) !important; }
        
        .in-check {
            background: radial-gradient(circle, #ff2a2a 0%, #b91c1c 80%) !important;
            box-shadow: inset 0 0 10px #7f1d1d;
            animation: pulseRed 1s infinite alternate;
        }
        @keyframes pulseRed { from { filter: brightness(1); } to { filter: brightness(1.3); } }

        .frozen { background-color: #38bdf8 !important; box-shadow: inset 0 0 8px #0284c7; }
        .frozen::before { content: '❄️'; position: absolute; top: 1px; right: 2px; font-size: 9px; z-index: 4; }
        
        .fire-square { background-color: #ea580c !important; box-shadow: inset 0 0 10px #9a3412; }
        .fire-square::before { content: '🔥'; position: absolute; font-size: 16px; z-index: 4; }

        .power-target { box-shadow: inset 0 0 0 3px #f59e0b !important; cursor: crosshair; }

        .hint::after { content: ''; width: 32%; height: 32%; background-color: rgba(20, 85, 30, 0.45); border-radius: 50%; position: absolute; z-index: 3; }
        .hint-capture::after { content: ''; width: 82%; height: 82%; border: 3px solid rgba(220, 38, 38, 0.75); border-radius: 50%; position: absolute; z-index: 3; background-color: rgba(220, 38, 38, 0.2); }

        .piece { width: 84%; height: 84%; z-index: 2; pointer-events: none; }
        .piece svg { width: 100%; height: 100%; display: block; }
        
        .coord-rank { position: absolute; top: 1px; left: 2px; font-size: 7.5px; font-weight: bold; pointer-events: none; }
        .coord-file { position: absolute; bottom: 1px; right: 2px; font-size: 7.5px; font-weight: bold; pointer-events: none; }
        
        .bottom-bar {
            width: 100%;
            max-width: 480px;
            background-color: #262522;
            padding: 6px 12px;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #383633;
            border-radius: 6px;
        }
        .btn {
            background: none;
            border: none;
            color: #9e9d9b;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
        }
        .btn span { font-size: 13px; font-weight: bold; }

        #custom-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: #262522;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #383633;
            width: 280px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .modal-content h3 { font-size: 14px; color: #fbbf24; }
        .modal-content input {
            background: #312e2b;
            border: 1px solid #45423e;
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            font-size: 14px;
            text-align: center;
        }
        .modal-btns {
            display: flex;
            gap: 8px;
            margin-top: 5px;
        }
        .modal-btns button {
            flex: 1;
            padding: 6px;
            border-radius: 4px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-confirm { background: #81b64c; color: #000; }
        .btn-cancel { background: #383633; color: #fff; }
    </style>
</head>
<body>

    <div class="top-bar">
        <span>♟️ Online Chess</span>
        <span id="role-badge" style="font-size: 10px; color: #81b64c;">Local Mode</span>
    </div>

    <div class="online-panel">
        <div class="online-row">
            <button class="online-btn" id="create-btn" onclick="createRoom()">Create Room</button>
            <input type="text" id="my-room-id" class="online-input" readonly placeholder="Your Room ID...">
            <button class="online-btn secondary" onclick="copyRoomId()">Copy</button>
        </div>
        <div class="online-row">
            <input type="text" id="join-room-id" class="online-input" placeholder="Paste Friend's Room ID...">
            <button class="online-btn" id="join-btn" onclick="joinRoom()">Join</button>
        </div>
    </div>

    <!-- Top Player Section -->
    <div class="player-section">
        <div class="player-bar">
            <div class="player-info">
                <div class="avatar" id="top-avatar">♟</div>
                <div class="player-name" id="top-name">Black</div>
                <button class="unlock-power-btn" id="top-unlock-btn" onclick="requestUnlock('top')">⚡ Power</button>
            </div>
            <div id="top-status" class="active-turn"></div>
        </div>
        <div class="power-drawer" id="top-drawer">
            <div class="power-grid" id="top-powers"></div>
        </div>
    </div>

    <div id="power-banner"></div>

    <div id="board-wrapper">
        <div id="board"></div>
    </div>

    <!-- Bottom Player Section -->
    <div class="player-section">
        <div class="power-drawer" id="bottom-drawer">
            <div class="power-grid" id="bottom-powers"></div>
        </div>
        <div class="player-bar">
            <div class="player-info">
                <div class="avatar" id="bottom-avatar">♙</div>
                <div class="player-name" id="bottom-name">White</div>
                <button class="unlock-power-btn" id="bottom-unlock-btn" onclick="requestUnlock('bottom')">⚡ Power</button>
            </div>
            <div id="bottom-status" class="active-turn">Your Turn</div>
        </div>
    </div>

    <div class="bottom-bar">
        <button class="btn" onclick="requestReset()"><span>↻</span>Reset</button>
        <button class="btn" onclick="cancelPower()"><span>✕</span>Cancel</button>
        <button class="btn" id="undo-btn" onclick="undoMove()"><span>‹</span>Undo (<span id="undo-count">10</span>)</button>
        <button class="btn" onclick="alert(getGameStatus())"><span>☰</span>Status</button>
    </div>

    <!-- Hidden Password Modal -->
    <div id="custom-modal">
        <div class="modal-content">
            <h3>🔒 Enter Password</h3>
            <input type="password" id="modal-psw-input" placeholder="••••••••" autocomplete="new-password">
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModal(false)">Cancel</button>
                <button class="btn-confirm" onclick="closeModal(true)">Confirm</button>
            </div>
        </div>
    </div>

        const game = new Chess();
        const boardEl = document.getElementById('board');
        const bannerEl = document.getElementById('power-banner');
        const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];

        let peer = null;
        let conn = null;
        let isOnline = false;
        let myColor = null;

        let selectedSquare = null;
        let validMoves = [];
        let lastMove = null;

        const powerList = [
            { id: 'double', name: '⚡ 2x' },
            { id: 'freeze', name: '🛡️ Freeze' },
            { id: 'promote', name: '✨ Knight' },
            { id: 'bomb', name: '💥 Bomb' },
            { id: 'swap', name: '🪞 Swap' },
            { id: 'teleport', name: '🏰 Tele' },
            { id: 'shield', name: '♻️ Shield' },
            { id: 'vision', name: '👁️ Vision' },
            { id: 'revival', name: '🔄 Revive' },
            { id: 'dash', name: '💨 Dash' },
            { id: 'fireball', name: '🔥 Fire' },
            { id: 'queen', name: '👑 Queen' },
            { id: 'magnet', name: '🧲 Magnet' },
            { id: 'sniper', name: '🎯 Sniper' },
            { id: 'godmode', name: '🌟 God' }
        ];

        let powersUsed = { w: {}, b: {} };
        let powersUnlocked = { w: false, b: false };
        let activePowerMode = null;
        let doubleMoveActive = false;
        let frozenSquare = null;
        let fireSquares = [];
        let shieldActive = { w: false, b: false };
        let godModeActive = { w: false, b: false };
        let swapSource = null;
        let teleportSource = null;
        let dashSource = null;
        let magnetSource = null;
        let undoLimit = 10;

        let pendingUnlockSide = null;

        function createRoom() {
            if (peer) peer.destroy();
            document.getElementById('create-btn').disabled = true;

            const shortId = 'CHESS-' + Math.random().toString(36).substring(2, 7).toUpperCase();
            peer = new Peer(shortId);

            peer.on('open', (id) => {
                document.getElementById('my-room-id').value = id;
            });

            peer.on('connection', (connection) => {
                conn = connection;
                myColor = 'w';
                isOnline = true;
                setupConnectionHandlers();
                document.getElementById('role-badge').textContent = "Online: White";
                resetGame(false);
            });

            peer.on('error', (err) => {
                document.getElementById('create-btn').disabled = false;
            });
        }

        function joinRoom() {
            const targetId = document.getElementById('join-room-id').value.trim();
            if (!targetId) { alert("Please paste a Room ID first!"); return; }

            if (peer) peer.destroy();
            document.getElementById('join-btn').disabled = true;

            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(targetId);
                conn.on('open', () => {
                    myColor = 'b';
                    isOnline = true;
                    setupConnectionHandlers();
                    document.getElementById('role-badge').textContent = "Online: Black";
                    resetGame(false);
                });
            });

            peer.on('error', (err) => {
                document.getElementById('join-btn').disabled = false;
            });
        }

        function setupConnectionHandlers() {
            document.getElementById('undo-btn').style.display = 'none';
            setupPlayerPanels();

            conn.on('data', (data) => {
                if (data.type === 'SYNC_STATE') {
                    game.load(data.fen);
                    lastMove = data.lastMove;
                    frozenSquare = data.frozenSquare;
                    fireSquares = data.fireSquares || [];
                    powersUsed = data.powersUsed;
                    shieldActive = data.shieldActive;
                    godModeActive = data.godModeActive;
                    selectedSquare = null;
                    validMoves = [];
                    activePowerMode = null;
                    hideBanner();
                    renderBoard();
                    checkGameOverState();
                } else if (data.type === 'RESET') {
                    resetGame(false);
                    showBanner("Opponent restarted the game!");
                    setTimeout(hideBanner, 2000);
                }
            });

            conn.on('close', () => {
                isOnline = false;
                myColor = null;
                document.getElementById('role-badge').textContent = "Disconnected";
            });
        }

        function broadcastState() {
            if (isOnline && conn && conn.open) {
                conn.send({
                    type: 'SYNC_STATE',
                    fen: game.fen(),
                    lastMove: lastMove,
                    frozenSquare: frozenSquare,
                    fireSquares: fireSquares,
                    powersUsed: powersUsed,
                    shieldActive: shieldActive,
                    godModeActive: godModeActive
                });
            }
        }

        function copyRoomId() {
            const input = document.getElementById('my-room-id');
            if (!input.value) return;
            input.select();
            navigator.clipboard.writeText(input.value);
        }

        function setupPlayerPanels() {
            const topColor = (isOnline && myColor === 'b') ? 'w' : 'b';
            const bottomColor = (isOnline && myColor === 'b') ? 'b' : 'w';

            document.getElementById('top-avatar').textContent = topColor === 'w' ? '♙' : '♟';
            document.getElementById('top-name').textContent = topColor === 'w' ? 'Opponent (White)' : 'Opponent (Black)';
            
            document.getElementById('bottom-avatar').textContent = bottomColor === 'w' ? '♙' : '♟';
            document.getElementById('bottom-name').textContent = bottomColor === 'w' ? 'You (White)' : 'You (Black)';

            // Hide opponent's unlock button in online mode
            if (isOnline) {
                document.getElementById('top-unlock-btn').style.display = 'none';
                document.getElementById('bottom-unlock-btn').style.display = powersUnlocked[bottomColor] ? 'none' : 'inline-block';
            } else {
                document.getElementById('top-unlock-btn').style.display = powersUnlocked[topColor] ? 'none' : 'inline-block';
                document.getElementById('bottom-unlock-btn').style.display = powersUnlocked[bottomColor] ? 'none' : 'inline-block';
            }

            document.getElementById('top-drawer').style.display = powersUnlocked[topColor] ? 'block' : 'none';
            document.getElementById('bottom-drawer').style.display = powersUnlocked[bottomColor] ? 'block' : 'none';

            buildPowerGrid('top-powers', topColor);
            buildPowerGrid('bottom-powers', bottomColor);
        }

        function buildPowerGrid(containerId, color) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            powerList.forEach(p => {
                const btn = document.createElement('button');
                btn.className = 'power-btn';
                btn.id = `${color}-${p.id}`;
                btn.textContent = p.name;
                btn.onclick = () => activatePower(color, p.id);
                container.appendChild(btn);
            });
        }

        function requestUnlock(side) {
            const topColor = (isOnline && myColor === 'b') ? 'w' : 'b';
            const bottomColor = (isOnline && myColor === 'b') ? 'b' : 'w';
            const targetColor = side === 'top' ? topColor : bottomColor;

            if (isOnline && myColor !== targetColor) return;

            pendingUnlockSide = { side, color: targetColor };
            document.getElementById('modal-psw-input').value = '';
            document.getElementById('custom-modal').style.display = 'flex';
            document.getElementById('modal-psw-input').focus();
        }

        function closeModal(isConfirmed) {
            const modal = document.getElementById('custom-modal');
            const input = document.getElementById('modal-psw-input');
            
            if (isConfirmed && pendingUnlockSide) {
                if (input.value === "Obito577") {
                    modal.style.display = 'none';
                    powersUnlocked[pendingUnlockSide.color] = true;
                    document.getElementById(`${pendingUnlockSide.side}-unlock-btn`).style.display = 'none';
                    document.getElementById(`${pendingUnlockSide.side}-drawer`).style.display = 'block';
                    updatePowerButtons();
                    pendingUnlockSide = null;
                } else {
                    alert("❌ Incorrect Password!");
                }
            } else {
                modal.style.display = 'none';
                pendingUnlockSide = null;
            }
        }

        function showBanner(msg, isDanger = false) {
            bannerEl.textContent = msg;
            if (isDanger) bannerEl.classList.add('banner-danger');
            else bannerEl.classList.remove('banner-danger');
            bannerEl.style.display = 'block';
        }

        function hideBanner() {
            if (game.in_check()) {
                const victim = game.turn() === 'w' ? 'White' : 'Black';
                showBanner(`⚠️ CHECK! ${victim} King is under attack!`, true);
                return;
            }
            bannerEl.classList.remove('banner-danger');
            bannerEl.style.display = 'none';
        }

        function activatePower(player, type) {
            if (game.turn() !== player) return;
            if (isOnline && myColor !== player) return;
            if (powersUsed[player][type]) return;

            cancelPower();

            if (type === 'double') {
                if (game.in_check()) { alert("Cannot use while in Check!"); return; }
                powersUsed[player].double = true;
                doubleMoveActive = true;
                showBanner("⚡ 2x MOVE ACTIVE: Make 2 moves in a row!");
                updatePowerButtons();
            } else if (type === 'freeze') {
                activePowerMode = 'freeze';
                document.getElementById(`${player}-freeze`).classList.add('active-mode');
                showBanner("🛡️ FREEZE: Tap an enemy piece to freeze");
                renderBoard();
            } else if (type === 'promote') {
                activePowerMode = 'promote';
                document.getElementById(`${player}-promote`).classList.add('active-mode');
                showBanner("✨ UPGRADE: Tap your Pawn to turn into Knight");
                renderBoard();
            } else if (type === 'bomb') {
                activePowerMode = 'bomb';
                document.getElementById(`${player}-bomb`).classList.add('active-mode');
                showBanner("💥 BOMB: Tap an enemy piece to destroy");
                renderBoard();
            } else if (type === 'swap') {
                activePowerMode = 'swap1';
                document.getElementById(`${player}-swap`).classList.add('active-mode');
                showBanner("🪞 SWAP: Tap one of your pieces first");
                renderBoard();
            } else if (type === 'teleport') {
                activePowerMode = 'teleport1';
                document.getElementById(`${player}-teleport`).classList.add('active-mode');
                showBanner("🏰 TELEPORT: Tap your piece to move anywhere");
                renderBoard();
            } else if (type === 'shield') {
                powersUsed[player].shield = true;
                shieldActive[player] = true;
                showBanner("♻️ SHIELD ACTIVE!");
                updatePowerButtons();
                broadcastState();
            } else if (type === 'vision') {
                powersUsed[player].vision = true;
                const moves = game.moves({verbose: true});
                if (moves.length > 0) {
                    const r = moves[Math.floor(Math.random() * moves.length)];
                    showBanner(`👁️ HINT: Try moving from ${r.from} to ${r.to}`);
                }
                updatePowerButtons();
                broadcastState();
            } else if (type === 'revival') {
                activePowerMode = 'revival';
                document.getElementById(`${player}-revival`).classList.add('active-mode');
                showBanner("🔄 REVIVE: Tap an empty square to summon Pawn");
                renderBoard();
            } else if (type === 'dash') {
                activePowerMode = 'dash1';
                document.getElementById(`${player}-dash`).classList.add('active-mode');
                showBanner("💨 DASH: Tap your piece to jump");
                renderBoard();
            } else if (type === 'fireball') {
                activePowerMode = 'fireball';
                document.getElementById(`${player}-fireball`).classList.add('active-mode');
                showBanner("🔥 FIRE: Tap an empty square to burn");
                renderBoard();
            } else if (type === 'queen') {
                activePowerMode = 'queen';
                document.getElementById(`${player}-queen`).classList.add('active-mode');
                showBanner("👑 QUEEN: Tap your Pawn to upgrade into Queen");
                renderBoard();
            } else if (type === 'magnet') {
                activePowerMode = 'magnet1';
                document.getElementById(`${player}-magnet`).classList.add('active-mode');
                showBanner("🧲 MAGNET: Tap an enemy piece to pull");
                renderBoard();
            } else if (type === 'sniper') {
                activePowerMode = 'sniper';
                document.getElementById(`${player}-sniper`).classList.add('active-mode');
                showBanner("🎯 SNIPER: Tap any enemy piece to eliminate");
                renderBoard();
            } else if (type === 'godmode') {
                powersUsed[player].godmode = true;
                godModeActive[player] = true;
                showBanner("🌟 GOD MODE ACTIVE!");
                updatePowerButtons();
                broadcastState();
            }
        }

        function cancelPower() {
            activePowerMode = null;
            swapSource = null;
            teleportSource = null;
            dashSource = null;
            magnetSource = null;
            document.querySelectorAll('.power-btn').forEach(b => b.classList.remove('active-mode'));
            if (!doubleMoveActive) hideBanner();
            renderBoard();
        }

        function swapTurnManually() {
            let fenParts = game.fen().split(' ');
            fenParts[1] = fenParts[1] === 'w' ? 'b' : 'w';
            fenParts[3] = '-';
            game.load(fenParts.join(' '));
        }

        function renderBoard() {
            boardEl.innerHTML = '';
            const board = game.board();
            const currentTurn = game.turn();
            const isCheck = game.in_check();
            const isFlipped = (isOnline && myColor === 'b');

            const moveMap = {};
            validMoves.forEach(m => {
                const targetPiece = game.get(m.to);
                if ((!targetPiece || targetPiece.type !== 'k') && !fireSquares.includes(m.to)) {
                    moveMap[m.to] = m.capture ? 'hint-capture' : 'hint';
                }
            });

            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {
                    const r = isFlipped ? 7 - i : i;
                    const c = isFlipped ? 7 - j : j;
                    
                    const squareName = files[c] + (8 - r);
                    const isLight = (r + c) % 2 === 0;
                    const squareEl = document.createElement('div');
                    const piece = board[r][c];
                    
                    squareEl.className = `square ${isLight ? 'light' : 'dark'}`;
                    if (selectedSquare === squareName || swapSource === squareName || teleportSource === squareName || dashSource === squareName || magnetSource === squareName) {
                        squareEl.classList.add('selected');
                    }
                    if (frozenSquare === squareName) squareEl.classList.add('frozen');
                    if (fireSquares.includes(squareName)) squareEl.classList.add('fire-square');
                    if (lastMove && (lastMove.from === squareName || lastMove.to === squareName)) {
                        squareEl.classList.add('last-move');
                    }
                    if (moveMap[squareName]) squareEl.classList.add(moveMap[squareName]);

                    if (isCheck && piece && piece.type === 'k' && piece.color === currentTurn) {
                        squareEl.classList.add('in-check');
                    }

                    if ((activePowerMode === 'freeze' || activePowerMode === 'bomb' || activePowerMode === 'sniper' || activePowerMode === 'magnet1') && piece && piece.color !== currentTurn && piece.type !== 'k') {
                        squareEl.classList.add('power-target');
                    }
                    if ((activePowerMode === 'promote' || activePowerMode === 'queen') && piece && piece.color === currentTurn && piece.type === 'p') {
                        squareEl.classList.add('power-target');
                    }
                    if ((activePowerMode === 'swap1' || activePowerMode === 'teleport1' || activePowerMode === 'dash1') && piece && piece.color === currentTurn) {
                        squareEl.classList.add('power-target');
                    }
                    if (activePowerMode === 'swap2' && piece && piece.color !== currentTurn && piece.type !== 'k') {
                        squareEl.classList.add('power-target');
                    }
                    if ((activePowerMode === 'teleport2' || activePowerMode === 'revival' || activePowerMode === 'dash2' || activePowerMode === 'fireball' || activePowerMode === 'magnet2') && !piece && !fireSquares.includes(squareName)) {
                        squareEl.classList.add('power-target');
                    }

                    if (j === 0) {
                        const rankEl = document.createElement('span');
                        rankEl.className = 'coord-rank';
                        rankEl.textContent = 8 - r;
                        squareEl.appendChild(rankEl);
                    }
                    if (i === 7) {
                        const fileEl = document.createElement('span');
                        fileEl.className = 'coord-file';
                        fileEl.textContent = files[c];
                        squareEl.appendChild(fileEl);
                    }

                    if (piece) {
                        const pieceEl = document.createElement('div');
                        pieceEl.className = 'piece';
                        const pieceKey = piece.color + piece.type.toUpperCase();
                        pieceEl.innerHTML = SVGS[pieceKey] || '';
                        squareEl.appendChild(pieceEl);
                    }

                    squareEl.onclick = () => onSquareClick(squareName);
                    boardEl.appendChild(squareEl);
                }
            }
            updateStatus();
            updatePowerButtons();
        }

        function onSquareClick(square) {
            const currentTurn = game.turn();
            if (isOnline && myColor !== currentTurn) return;

            const clickedPiece = game.get(square);

            if (activePowerMode === 'freeze') {
                if (clickedPiece && clickedPiece.color !== currentTurn && clickedPiece.type !== 'k') {
                    frozenSquare = square;
                    powersUsed[currentTurn].freeze = true;
                    activePowerMode = null;
                    hideBanner();
                    renderBoard();
                    broadcastState();
                }
                return;
            }

            if (activePowerMode === 'promote') {
                if (clickedPiece && clickedPiece.color === currentTurn && clickedPiece.type === 'p') {
                    game.remove(square);
                    game.put({ type: 'n', color: currentTurn }, square);
                    powersUsed[currentTurn].promote = true;
                    activePowerMode = null;
                    hideBanner();
                    renderBoard();
                    broadcastState();
                }
                return;
            }

            if (activePowerMode === 'queen') {
                if (clickedPiece && clickedPiece.color === currentTurn && clickedPiece.type === 'p') {
                    game.remove(square);
                    game.put({ type: 'q', color: currentTurn }, square);
                    powersUsed[currentTurn].queen = true;
                    activePowerMode = null;
                    hideBanner();
                    renderBoard();
                    broadcastState();
                }
                return;
            }

            if (activePowerMode === 'bomb' || activePowerMode === 'sniper') {
                if (clickedPiece && clickedPiece.color !== currentTurn && clickedPiece.type !== 'k') {
                    game.remove(square);
                    powersUsed[currentTurn][activePowerMode] = true;
                    activePowerMode = null;
                    hideBanner();
                    renderBoard();
                    broadcastState();
                }
                return;
            }

            if (activePowerMode === 'swap1') {
                if (clickedPiece && clickedPiece.color === currentTurn) {
                    swapSource = square;
                    activePowerMode = 'swap2';
                    showBanner("🪞 SWAP: Now tap an enemy piece");
                    renderBoard();
                }
                return;
            }
            if (activePowerMode === 'swap2') {
                if (clickedPiece && clickedPiece.color !== currentTurn && clickedPiece.type !== 'k') {
                    const p1 = game.get(swapSource);
                    const p2 = game.get(square);
                    game.remove(swapSource);
                    game.remove(square);
                    game.put(p1, square);
                    game.put(p2, swapSource);
                    powersUsed[currentTurn].swap = true;
                    activePowerMode = null;
                    swapSource = null;
                    hideBanner();
                    renderBoard();
                    broadcastState();
                }
                return;
            }

            if (activePowerMode === 'teleport1') {
                if (clickedPiece && clickedPiece.color === currentTurn) {
                    teleportSource = square;
                    activePowerMode = 'teleport2';
                    showBanner("🏰 TELEPORT: Tap any empty square");
                    renderBoard();
                }
                return;
            }
            if (activePowerMode === 'teleport2') {
                if (!clickedPiece && !fireSquares.includes(square)) {
                    const p = game.get(teleportSource);
                    game.remove(teleportSource);
                    game.put(p, square);
                    powersUsed[currentTurn].teleport = true;
                    activePowerMode = null;
                    teleportSource = null;
                    hideBanner();
                    renderBoard();
                    broadcastState();
                    checkGameOverState();
                }
                return;
            }

            if (activePowerMode === 'revival') {
                if (!clickedPiece && !fireSquares.includes(square)) {
                    game.put({ type: 'p', color: currentTurn }, square);
                    powersUsed[currentTurn].revival = true;
                    activePowerMode = null;
                    hideBanner();
                    renderBoard();
                    broadcastState();
                }
                return;
            }

            if (activePowerMode === 'dash1') {
                if (clickedPiece && clickedPiece.color === currentTurn) {
                    dashSource = square;
                    activePowerMode = 'dash2';
                    showBanner("💨 DASH: Tap an empty square");
                    renderBoard();
                }
                return;
            }
            if (activePowerMode === 'dash2') {
                if (!clickedPiece && !fireSquares.includes(square)) {
                    const p = game.get(dashSource);
                    game.remove(dashSource);
                    game.put(p, square);
                    powersUsed[currentTurn].dash = true;
                    activePowerMode = null;
                    dashSource = null;
                    hideBanner();
                    renderBoard();
                    broadcastState();
                    checkGameOverState();
                }
                return;
            }

            if (activePowerMode === 'fireball') {
                if (!clickedPiece && !fireSquares.includes(square)) {
                    fireSquares.push(square);
                    powersUsed[currentTurn].fireball = true;
                    activePowerMode = null;
                    hideBanner();
                    renderBoard();
                    broadcastState();
                }
                return;
            }

            if (activePowerMode === 'magnet1') {
                if (clickedPiece && clickedPiece.color !== currentTurn && clickedPiece.type !== 'k') {
                    magnetSource = square;
                    activePowerMode = 'magnet2';
                    showBanner("🧲 MAGNET: Tap an empty square");
                    renderBoard();
                }
                return;
            }
            if (activePowerMode === 'magnet2') {
                if (!clickedPiece && !fireSquares.includes(square)) {
                    const p = game.get(magnetSource);
                    game.remove(magnetSource);
                    game.put(p, square);
                    powersUsed[currentTurn].magnet = true;
                    activePowerMode = null;
                    magnetSource = null;
                    hideBanner();
                    renderBoard();
                    broadcastState();
                }
                return;
            }

            const targetValid = validMoves.find(m => m.to === square);
            if (selectedSquare && targetValid) {
                if (fireSquares.includes(square)) {
                    alert("That square is blocked by Fire!");
                    return;
                }
                const targetPiece = game.get(square);
                if (targetPiece && targetPiece.type === 'k') {
                    alert("You cannot capture the King!");
                    return;
                }

                const move = game.move({ from: selectedSquare, to: square, promotion: 'q' });

                if (move) {
                    lastMove = { from: move.from, to: move.to };
                    if (frozenSquare === square) frozenSquare = null;

                    if (doubleMoveActive) {
                        doubleMoveActive = false;
                        hideBanner();
                        if (!game.in_check() && !game.game_over()) {
                            swapTurnManually();
                            showBanner("⚡ 2nd Move! Go again.");
                            setTimeout(hideBanner, 1500);
                        }
                    } else {
                        if (frozenSquare && game.get(frozenSquare)?.color !== currentTurn) {
                            frozenSquare = null;
                        }
                    }
                    if (!isOnline && undoLimit < 10) undoLimit++;
                    document.getElementById('undo-count').textContent = undoLimit;
                }

                selectedSquare = null;
                validMoves = [];
                renderBoard();
                broadcastState();
                checkGameOverState();
                return;
            }

            if (clickedPiece && clickedPiece.color === currentTurn) {
                if (square === frozenSquare) {
                    showBanner("❄️ This piece is FROZEN!");
                    setTimeout(hideBanner, 1500);
                    return;
                }
                selectedSquare = square;
                const moves = game.moves({ square: square, verbose: true });
                validMoves = moves.filter(m => {
                    const destPiece = game.get(m.to);
                    return (!destPiece || destPiece.type !== 'k') && !fireSquares.includes(m.to);
                }).map(m => ({ to: m.to, capture: m.captured ? true : false }));
            } else {
                selectedSquare = null;
                validMoves = [];
            }
            renderBoard();
        }

        function checkGameOverState() {
            if (game.game_over()) {
                const turn = game.turn();
                if (godModeActive[turn]) {
                    godModeActive[turn] = false;
                    showBanner("🌟 GOD MODE PROTECTED YOU!", true);
                    game.undo();
                    renderBoard();
                    broadcastState();
                    return;
                }
                if (shieldActive[turn]) {
                    shieldActive[turn] = false;
                    showBanner("♻️ SHIELD SAVED YOU!", true);
                    game.undo();
                    renderBoard();
                    broadcastState();
                } else {
                    const winner = turn === 'w' ? 'Black' : 'White';
                    showBanner(`👑 CHECKMATE! ${winner} Wins!`, true);
                    setTimeout(() => alert(`Game Over! ${winner} wins by Checkmate!`), 200);
                }
            }
        }

        function undoMove() {
            if (isOnline) return;
            if (undoLimit <= 0) { alert("Maximum 10 undos reached!"); return; }
            const undone = game.undo();
            if (undone) {
                undoLimit--;
                document.getElementById('undo-count').textContent = undoLimit;
                lastMove = null;
                selectedSquare = null;
                validMoves = [];
                frozenSquare = null;
                renderBoard();
            }
        }

        function updatePowerButtons() {
            const turn = game.turn();
            ['w', 'b'].forEach(color => {
                powerList.forEach(p => {
                    const btn = document.getElementById(`${color}-${p.id}`);
                    if (btn) {
                        const disabledByTurn = (turn !== color) || (isOnline && myColor !== color);
                        btn.disabled = disabledByTurn || powersUsed[color][p.id];
                    }
                });
            });
        }

        function updateStatus() {
            const topColor = (isOnline && myColor === 'b') ? 'w' : 'b';
            const bottomColor = (isOnline && myColor === 'b') ? 'b' : 'w';

            const topStatus = document.getElementById('top-status');
            const bottomStatus = document.getElementById('bottom-status');
            const isCheck = game.in_check();
            const turn = game.turn();

            topStatus.classList.remove('check-text');
            bottomStatus.classList.remove('check-text');

            if (turn === bottomColor) {
                if (isCheck) { bottomStatus.textContent = '⚠️ CHECK!'; bottomStatus.classList.add('check-text'); }
                else bottomStatus.textContent = isOnline ? 'Your Turn' : 'Turn';
                topStatus.textContent = '';
            } else {
                if (isCheck) { topStatus.textContent = '⚠️ CHECK!'; topStatus.classList.add('check-text'); }
                else topStatus.textContent = isOnline ? "Opponent's Turn" : 'Turn';
                bottomStatus.textContent = '';
            }
        }

        function getGameStatus() {
            if (game.in_checkmate()) return (game.turn() === 'w' ? 'Black' : 'White') + ' wins by Checkmate!';
            if (game.in_draw()) return 'Draw!';
            if (game.in_check()) return (game.turn() === 'w' ? 'White' : 'Black') + ' is in CHECK!';
            return (game.turn() === 'w' ? 'White' : 'Black') + ' to move.';
        }

        function requestReset() {
            resetGame(true);
        }

        function resetGame(shouldBroadcast = false) {
            game.reset();
            selectedSquare = null;
            validMoves = [];
            lastMove = null;
            frozenSquare = null;
            fireSquares = [];
            doubleMoveActive = false;
            activePowerMode = null;
            swapSource = null;
            teleportSource = null;
            dashSource = null;
            magnetSource = null;
            undoLimit = 10;
            document.getElementById('undo-count').textContent = undoLimit;
            shieldActive = { w: false, b: false };
            godModeActive = { w: false, b: false };
            powersUnlocked = { w: false, b: false };
            
            powerList.forEach(p => {
                powersUsed.w[p.id] = false;
                powersUsed.b[p.id] = false;
            });

            bannerEl.classList.remove('banner-danger');
            bannerEl.style.display = 'none';
            setupPlayerPanels();
            renderBoard();

            if (shouldBroadcast && isOnline && conn && conn.open) {
                conn.send({ type: 'RESET' });
            }
        }

        setupPlayerPanels();
        resetGame(false);
    </script>
</body>
</html>
